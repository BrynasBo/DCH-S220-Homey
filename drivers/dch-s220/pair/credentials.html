<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="pair.title">Anslut DCH-S220</h1>
    <p class="homey-subtitle" data-i18n="pair.subtitle">Ange sirenens lokala nätverksuppgifter.</p>
  </header>
  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label class="homey-form-label" for="ip">IP-adress</label>
      <input class="homey-form-input" id="ip" type="text" value="192.168.50.129">
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="username">Användarnamn</label>
      <input class="homey-form-input" id="username" type="text" value="Admin" autocomplete="username">
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="pin">Sexsiffrig PIN-kod</label>
      <input class="homey-form-input" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
    </div>
  </fieldset>
  <button id="connect" class="homey-button-primary-full">Testa anslutning</button>
  <script>
    Homey.setTitle('Anslut DCH-S220');
    document.getElementById('connect').addEventListener('click', async () => {
      const button = document.getElementById('connect');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Ansluter...';

      try {
        await Homey.emit('credentials', {
          ip: document.getElementById('ip').value,
          username: document.getElementById('username').value,
          pin: document.getElementById('pin').value,
        });
        Homey.showView('list_devices');
      } catch (error) {
        await Homey.alert(error.message || String(error), 'error');
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    });
  </script>
</body>
</html>
